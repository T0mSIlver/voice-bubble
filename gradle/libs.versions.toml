[versions]
agp = "9.4.1"
core-ktx = "1.17.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
# Alpha, the only release the docs name (developers.google.com/ml-kit/genai/speech-recognition/android).
mlkit-speech = "1.0.0-alpha1"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
mlkit-speech = { group = "com.google.mlkit", name = "genai-speech-recognition", version.ref = "mlkit-speech" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
